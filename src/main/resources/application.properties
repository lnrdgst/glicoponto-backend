spring.application.name=glicemio-backend
spring.config.import=optional:file:./.env[.properties]
glicemio.auth.supabase.issuer=${SUPABASE_JWT_ISSUER}
glicemio.auth.supabase.jwk-set-uri=${SUPABASE_JWT_JWK_SET_URI}
glicemio.auth.supabase.audience=${SUPABASE_JWT_AUDIENCE}
glicemio.auth.supabase.jws-algorithm=${SUPABASE_JWT_JWS_ALGORITHM}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
# Spring's debug groups otherwise log request/response DTOs and SQL exception details.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
